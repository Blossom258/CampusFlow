[build]
  command = "pnpm -r --filter @project/utils --filter @project/workflow-sdk --filter @project/ui-components build && pnpm -F @project/saas-platform build"
  publish = "apps/saas-platform/dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
